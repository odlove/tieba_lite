syntax = "proto3";

package tiebalite.forumguide;

option java_multiple_files = true;
option java_package = "app.tiebalite.core.network.proto.forumguide";

message ForumGuideResLite {
  ForumGuideErrorLite error = 1;
  ForumGuideResDataLite data = 2;
}

message ForumGuideResDataLite {
  repeated ForumGuideLikeForumLite like_forum = 2;
}

message ForumGuideLikeForumLite {
  uint64 forum_id = 1;
  string forum_name = 2;
  string avatar = 3;
  uint32 hot_num = 4;
  int32 level_id = 10;
  int32 is_sign = 12;
}

message ForumGuideErrorLite {
  int32 errorno = 1;
  string errmsg = 2;
  string usermsg = 3;
}
